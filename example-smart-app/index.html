<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SMART ECG Viewer</title>
    <link rel="stylesheet" type="text/css" href="./src/css/example-smart-app.css" />
  </head>
  <body>
    <div id="errors"></div>
    <div id="loading" class="spinner" aria-label="Loading">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
    <div id="holder"></div>

    <script src="https://cdn.jsdelivr.net/npm/fhirclient/bundle/fhir-client.js"></script>
    <script src="./src/js/patient-directory.js"></script>
    <script src="./src/js/example-smart-app.js"></script>
    <script>
      extractData().then(
        function(patient) {
          drawVisualization(patient);
        },
        function() {
          var loading = document.getElementById('loading');
          var errors = document.getElementById('errors');
          if (loading) {
            loading.style.display = 'none';
          }
          if (errors) {
            errors.innerHTML = '<p>Failed to call FHIR Service</p>';
          }
        }
      );
    </script>
  </body>
</html>
