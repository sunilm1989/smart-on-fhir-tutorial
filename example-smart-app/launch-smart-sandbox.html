<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <link rel='stylesheet' type='text/css' href='./lib/css/cerner-smart-embeddable-lib-1.0.0.min.css'>
    -->
    <title>Example-SMART-App</title>
  </head>
  <body>
    <!-- Required JS files to enable this page to embed within an MPage -->
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/6.26.0/polyfill.min.js'></script>
      <script src='./lib/js/cerner-smart-embeddable-lib-1.0.0.min.js'></script>
    -->

    <!-- SMART JS Client Library for FHIR R4 -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/bundle/fhir-client.js"></script>

    <!-- Currently, the SMART App Launcher (https://launch.smarthealthit.org) does not check/validate the client_id field.
        If/when this changes, or when working with other authorization servers, please update the client_id field here. -->
    <script>
      (function() {
        var names = [
          'studyId',
          'studyID',
          'study_id',
          'studyIdentifier',
          'study_identifier',
          'cerner_accession',
          'cerner_studyIdentifier',
          'cerner_study_identifier',
          '__accession',
          '__studyIdentifier',
          '__study_identifier',
          'accession',
          'accessionNumber',
          'accession_number'
        ];

        function getParam(name) {
          var query = window.location.search ? window.location.search.substring(1) : '';
          var pairs = query ? query.split('&') : [];
          var i;
          var parts;

          for (i = 0; i < pairs.length; i += 1) {
            parts = pairs[i].split('=');
            if (decodeURIComponent(parts[0] || '').toLowerCase() === name.toLowerCase()) {
              return decodeURIComponent((parts[1] || '').replace(/\+/g, ' '));
            }
          }

          return '';
        }

        for (var i = 0; i < names.length; i += 1) {
          var value = getParam(names[i]);
          if (value) {
            try {
              sessionStorage.setItem('smart_ecg_study_id', value);
            } catch (e) {
            }
            break;
          }
        }
      })();

      FHIR.oauth2.authorize({
        clientId: 'b7ce065d-3dae-4520-83b7-935d42e68a09',
        client_id: 'b7ce065d-3dae-4520-83b7-935d42e68a09',
        redirectUri: './index.html',
        redirect_uri: './index.html',
        scope: 'launch openid fhirUser patient/Patient.read patient/Observation.read patient/DiagnosticReport.read patient/ImagingStudy.read patient/DocumentReference.read'
      });
    </script>
    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
  </body>
</html>
