<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <!--
      Temporarily disable cerner-smart-embeddable-lib
    <link rel='stylesheet' type='text/css' href='./lib/css/cerner-smart-embeddable-lib-1.0.0.min.css'>
    -->
    
    <title>Example-SMART-App</title>
  </head>
  <body>
    <!-- Required JS files to enable this page to embed within an MPage -->
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/6.26.0/polyfill.min.js'></script>
      <script src='./lib/js/cerner-smart-embeddable-lib-1.0.0.min.js'></script>
    -->        

    <!-- SMART JS Client Library for FHIR R4 -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/bundle/fhir-client.js"></script>
    <script>
      var SI01_CLIENT_ID = 'b7ce065d-3dae-4520-83b7-935d42e68a09';
      var SI02_CLIENT_ID = '81ee9f73-4149-44ed-83b2-d726665a571e';
      var SI01_FHIR_HOST = 'si01-fhir-ohehr-l1-adapters-dev-axkbv4jfb37h-px-pp.integration.us-phoenix-1.ocp.oraclecloud.com';
      var SI02_FHIR_HOST = 'si02-fhir-ohehr-l1-adapters-dev-axkbv4jfb37h-px-pp.integration.us-phoenix-1.ocp.oraclecloud.com';

      var shouldAuthorize = (function() {
        function getParam(name) {
          var query = window.location.search ? window.location.search.substring(1) : '';
          var pairs = query ? query.split('&') : [];
          var i;
          var parts;

          for (i = 0; i < pairs.length; i += 1) {
            parts = pairs[i].split('=');
            if (decodeURIComponent(parts[0] || '').toLowerCase() === name.toLowerCase()) {
              return decodeURIComponent((parts[1] || '').replace(/\+/g, ' '));
            }
          }

          return '';
        }

        function normalizeLaunchContextKey(name) {
          return String(name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function isStudyContextParam(name) {
          var key = normalizeLaunchContextKey(name);
          return key.indexOf('accession') > -1 ||
            key === 'studyid' ||
            key.indexOf('studyidentifier') > -1;
        }

        function getStudyContextParam() {
          var query = window.location.search ? window.location.search.substring(1) : '';
          var pairs = query ? query.split('&') : [];
          var i;
          var parts;

          for (i = 0; i < pairs.length; i += 1) {
            parts = pairs[i].split('=');
            if (isStudyContextParam(decodeURIComponent(parts[0] || ''))) {
              return decodeURIComponent((parts[1] || '').replace(/\+/g, ' '));
            }
          }

          return '';
        }

        function hasSmartLaunchContext() {
          return !!(
            getParam('iss') ||
            getParam('launch') ||
            getParam('fhirServiceUrl') ||
            getParam('code') ||
            getParam('state')
          );
        }

        var studyIdValue = getStudyContextParam();
        if (studyIdValue) {
          try {
            sessionStorage.setItem('smart_ecg_study_id', studyIdValue);
          } catch (e) {
          }
        } else {
          try {
            sessionStorage.removeItem('smart_ecg_study_id');
          } catch (e) {
          }
        }

        if (!hasSmartLaunchContext()) {
          window.location.replace('./index.html' + window.location.search + window.location.hash);
          return false;
        }

        return true;
      })();

      function getLaunchParam(name) {
        var query = window.location.search ? window.location.search.substring(1) : '';
        var pairs = query ? query.split('&') : [];
        var i;
        var parts;

        for (i = 0; i < pairs.length; i += 1) {
          parts = pairs[i].split('=');
          if (decodeURIComponent(parts[0] || '').toLowerCase() === name.toLowerCase()) {
            return decodeURIComponent((parts[1] || '').replace(/\+/g, ' '));
          }
        }

        return '';
      }

      function resolveClientId() {
        var issuer = (getLaunchParam('iss') || getLaunchParam('fhirServiceUrl') || '').toLowerCase();

        if (issuer.indexOf(SI02_FHIR_HOST) > -1) {
          return SI02_CLIENT_ID;
        }

        if (issuer.indexOf(SI01_FHIR_HOST) > -1) {
          return SI01_CLIENT_ID;
        }

        return SI01_CLIENT_ID;
      }

      if (shouldAuthorize) {
        var clientId = resolveClientId();

        FHIR.oauth2.authorize({
          clientId: clientId,
          client_id: clientId,
          redirectUri: 'https://sunilm1989.github.io/smart-on-fhir-tutorial/example-smart-app/index.html',
          redirect_uri: 'https://sunilm1989.github.io/smart-on-fhir-tutorial/example-smart-app/index.html',
          scope: 'launch openid fhirUser patient/Patient.read patient/Observation.read patient/DiagnosticReport.read patient/ImagingStudy.read patient/DocumentReference.read'
        });
      }
    </script>
    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
  </body>
</html>
