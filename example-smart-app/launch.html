<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <!--
      Temporarily disable cerner-smart-embeddable-lib
    <link rel='stylesheet' type='text/css' href='./lib/css/cerner-smart-embeddable-lib-1.0.0.min.css'>
    -->
    
    <title>Example-SMART-App</title>
  </head>
  <body>
    <!-- Required JS files to enable this page to embed within an MPage -->
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/6.26.0/polyfill.min.js'></script>
      <script src='./lib/js/cerner-smart-embeddable-lib-1.0.0.min.js'></script>
    -->        

    <!-- FHIR Client JS Library -->
    <script src='./lib/js/fhir-client-v0.1.12.js'></script>

    <!-- Prevent session bleed caused by single threaded embedded browser and sessionStorage API -->
    <!-- https://github.com/cerner/fhir-client-cerner-additions -->
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>
    <script>
      (function() {
        var names = [
          'studyId',
          'studyID',
          'study_id',
          'studyIdentifier',
          'study_identifier',
          'cerner_accession',
          'cerner_studyIdentifier',
          'cerner_study_identifier',
          '__accession',
          '__studyIdentifier',
          '__study_identifier',
          'accession',
          'accessionNumber',
          'accession_number'
        ];

        function getParam(name) {
          var query = window.location.search ? window.location.search.substring(1) : '';
          var pairs = query ? query.split('&') : [];
          var i;
          var parts;

          for (i = 0; i < pairs.length; i += 1) {
            parts = pairs[i].split('=');
            if (decodeURIComponent(parts[0] || '').toLowerCase() === name.toLowerCase()) {
              return decodeURIComponent((parts[1] || '').replace(/\+/g, ' '));
            }
          }

          return '';
        }

        for (var i = 0; i < names.length; i += 1) {
          var value = getParam(names[i]);
          if (value) {
            try {
              sessionStorage.setItem('smart_ecg_study_id', value);
            } catch (e) {
            }
            break;
          }
        }
      })();

      FHIR.oauth2.authorize({
        'client_id': '<enter your client id here>',
        'scope':  'patient/Patient.read patient/Observation.read launch online_access openid profile'
      });
    </script>
    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
  </body>
</html>
